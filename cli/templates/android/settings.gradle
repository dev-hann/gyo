pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "{{PROJECT_NAME}}"

include ':app'
include ':gyo-bridge'

// The plugins installed in lib/, as Gradle modules. gyo rewrites the file
// before every build.
apply from: 'gyo.settings.gradle'
