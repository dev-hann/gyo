// The native half of the bridge, as a module of its own: the app depends on
// it and plugins compile against it.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'gyo.plugins.bridge'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Android's org.json is a stub in JVM unit tests; the real one answers
    // JSONObject.quote for the bridge script tests.
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}
