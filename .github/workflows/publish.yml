name: Publish Plugin

on:
  push:
    tags:
      - 'plugins/*/v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Volta
        uses: volta-cli/action@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.voltrc'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Determine package from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_PATH=$(echo "$TAG" | sed 's|/v[0-9].*||')
          PKG_NAME=$(node -e "console.log(require('./$PKG_PATH/package.json').name)")
          echo "path=$PKG_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify tag version matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/plugins/*/v}"
          PKG_VERSION=$(node -e "console.log(require('./${{ steps.pkg.outputs.path }}/package.json').version)")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build package
        run: npm run build -w ${{ steps.pkg.outputs.name }}

      - name: Typecheck package
        run: npm run typecheck -w ${{ steps.pkg.outputs.name }}

      - name: Test package
        run: npm run test -w ${{ steps.pkg.outputs.name }}

      - name: Publish to npm
        run: npm publish -w ${{ steps.pkg.outputs.name }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
